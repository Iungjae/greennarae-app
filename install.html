<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f2f2f7">
<title>그린나래 앱 설치</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/fonts/pretendard/pretendardvariable-dynamic-subset.css">
<style>
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    background:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,"Pretendard Variable",Pretendard,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:#1c1c1e;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
    word-break:keep-all;overflow-wrap:break-word}
  .card{background:#fff;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.07);padding:40px 36px 32px;width:min(440px,100%);text-align:center}
  .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
  .brand .logo{width:38px;height:38px;border-radius:10px}
  .brand h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.02em}
  .sub{color:#636366;font-size:15px;margin:2px 0 26px}
  .qrbox{background:#fff;border:1px solid rgba(60,60,67,.14);border-radius:18px;padding:16px;width:min(300px,100%);margin:0 auto}
  .qrbox img{width:100%;height:auto;display:block;image-rendering:pixelated}
  .cap{margin-top:22px;font-size:17px;font-weight:700}
  .url{margin-top:8px;font-size:14px;color:#1a7a45;font-weight:600;word-break:break-all;user-select:all;background:#e3f3ea;border-radius:10px;padding:9px 12px}
  .steps{text-align:left;margin-top:24px;border-top:1px solid rgba(60,60,67,.12);padding-top:20px;display:flex;flex-direction:column;gap:14px}
  .step{font-size:15px;line-height:1.55}
  .step .t{color:#3a3a3c} .step b{color:#1c1c1e;font-weight:700}
  .notes{text-align:left;margin-top:18px;border-top:1px solid rgba(60,60,67,.12);padding-top:16px;display:flex;flex-direction:column;gap:10px;font-size:14px;color:#636366;line-height:1.55}
  .notes p{margin:0}
  .notes .nl{font-weight:700;color:#3a3a3c}
  .notes .warn{color:#c2410c}
  .notes a{color:#1a7a45;font-weight:600;text-decoration:none}
  @media (max-width:380px){ body{padding:16px} .card{padding:30px 22px 26px} }
</style></head>
<body>
  <script src="/inapp.js"></script>
  <div class="card">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#1b5e43"/><path d="M32 52C32 45 30.5 39 33 32" stroke="#e0f7ec" stroke-width="4.2" stroke-linecap="round" fill="none"/><ellipse cx="23" cy="31" rx="10.5" ry="6.6" transform="rotate(-28 23 31)" fill="#5cc793"/><ellipse cx="41" cy="26" rx="12" ry="7.6" transform="rotate(32 41 26)" fill="#a9e5c8"/></svg>
      <h1>그린나래</h1>
    </div>
    <div class="sub">휴대폰 카메라로 아래 QR을 스캔하세요</div>
    <div class="qrbox"><img alt="설치 QR" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAXIAAAFyAQMAAADS6sNKAAAABlBMVEUPFyr///9JwCnAAAABuElEQVR42u2bQW7EMAhFUXMAHylXz5FygEhugjGQ7kZqVWG9LKxJ5q/mCfhARvpH1yHo0aNHjx49+l/Si13b82S7b9vz3XP0c363q/5LPrvQ/6/e+Cq8ft5odz3mrR0ugW9Rvk+YKlp7dknw1cCG7yp8LYg1U8N3Mb43Vck1eYfvUvXXolb5tm6RTP2tztf9s/mrdOCf6/ONSzFm//yjn+L3LN4fWa29/bP2v4fkmgzfqvm5KdBLRtVNTdJ9aJKGb+341YZXPGqzdSY/l6+/Grr7cFrbCGfj28xJw7d8/I4yq01Sc6dFf7SEf9Y2yBcKka79Fr61+6PL+t/wzz31vxv5ufh8w7Ly2A8Ovg4+dkrwLeqvnk/umi2cw1URv+X7356zsgzS7wO+lfPzjF+ddPho40UfvnX7Ix9tvPuj6Z/pf6v3v/5+zqQ6IKdMDd/K/dF7f3SKBG7mV0vUX8mz5lgtvIbQ8C2en9NqwadWqR2Gb11/FbNmgzxmWiL454X4jk3SNFS2GOb9unX4+gsb/in5MPiWr78xyYqdP/G7in9OW99DJJlo4neJ/pf/36FHjx49evR/r/8GRPjLFWueBjQAAAAASUVORK5CYII="></div>
    <div class="cap">그린나래 좌석 예약 앱</div>
    <div class="url">guerinnarae-app.pages.dev</div>
    <div class="steps">
      <div class="step"><span class="t"><b>1. QR 스캔</b> — 기본 카메라로 위 QR을 스캔해주세요.</span></div>
      <div class="step"><span class="t"><b>아이폰(Safari)</b> — 하단 <b>공유</b> 버튼 → <b>홈 화면에 추가</b></span></div>
      <div class="step"><span class="t"><b>안드로이드(Chrome)</b><br>우측 상단 <b>⋮</b> → <b>앱 설치</b>(또는 홈 화면에 추가)</span></div>
    </div>
    <div class="notes">
      <p><span class="nl warn">*주의사항</span> - 반드시 괄호 안의 브라우저로 지시에 따라 설치해주세요.</p>
      <p><span class="nl">*문의사항</span> - <a href="https://pf.kakao.com/_BvjQn" target="_blank" rel="noopener">사생회 카카오톡 채널</a>로 부탁드립니다.</p>
    </div>
  </div>
</body></html>
