<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>그린나래 앱 설치</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#f1f5f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo',sans-serif;color:#0f172a;padding:24px}
  .card{background:#fff;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.08);padding:40px 40px 34px;width:min(440px,92vw);text-align:center}
  .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
  .brand .logo{width:38px;height:38px;border-radius:10px}
  .brand h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em}
  .sub{color:#64748b;font-size:15px;margin:2px 0 26px}
  .qrbox{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:16px;width:min(300px,74vw);margin:0 auto}
  .qrbox img{width:100%;height:auto;display:block;image-rendering:pixelated}
  .cap{margin-top:22px;font-size:17px;font-weight:700}
  .url{margin-top:8px;font-size:12.5px;color:#0d9f6e;word-break:break-all;user-select:all;background:#f0fdf4;border-radius:9px;padding:8px 10px}
  .steps{text-align:left;margin-top:24px;border-top:1px solid #eef2f1;padding-top:20px;display:flex;flex-direction:column;gap:14px}
  .step{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.5}
  .step .t{color:#475569} .step b{color:#0f172a}
  .notes{text-align:left;margin-top:18px;border-top:1px solid #eef2f1;padding-top:16px;display:flex;flex-direction:column;gap:10px;font-size:13px;color:#64748b;line-height:1.55}
  .notes p{margin:0}
  .notes .nl{font-weight:700;color:#475569}
  .notes .warn{color:#c2410c}
</style></head>

  <div class="card">

      <div class="step"><span class="t"><b>아이폰(Safari)</b> — 하단 <b>공유</b> 버튼 → <b>홈 화면에 추가</b></span></div>
