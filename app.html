<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="그린나래 좌석">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>그린나래 좌석</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#f2f2f7;--card:#fff;--sub:#f2f2f7;
    --ink:#1c1c1e;--ink2:#6b6b70;--ink3:#a3a3ab;
    --sep:rgba(60,60,67,.16);--field:#e7e7ec;--track:#e5e5ea;
    --tint:#1f9254;--tint-d:#1a7a45;--tint-bg:#e6f4ec;
    --red:#ff3b30;--red-bg:#ffe9e8;
    --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);overscroll-behavior:none;-webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;font-family:var(--sf);letter-spacing:-.011em}
  [hidden]{display:none!important}
  button{font-family:inherit}
  .num,.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .mono{letter-spacing:0}   /* 시스템폰트 + 고정폭 숫자(애플식). 진짜 모노는 QR 토큰만 인라인으로 사용 */
  .app{max-width:440px;margin:0 auto;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
  #screen{flex:1;min-height:0;display:flex;flex-direction:column}
  /* 내비 바 */
  .hd{position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;
    padding-top:calc(7px + env(safe-area-inset-top));padding-bottom:9px;min-height:calc(44px + env(safe-area-inset-top))}
  .hd .lg{width:23px;height:23px;border-radius:6px;display:block}
  .hd h1{font-size:17px;font-weight:600;margin:0}
  .hd .menu{position:absolute;right:8px;bottom:6px;background:none;border:0;padding:8px;color:var(--ink);line-height:0}
  .hd .back{position:absolute;left:5px;bottom:6px;background:none;border:0;color:var(--tint);font-size:16px;font-weight:400;padding:6px 8px}
  /* 홈: 3블록이 화면을 꽉 채움 */
  main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:1px 16px calc(11px + env(safe-area-inset-bottom))}
  .card{flex:1 1 auto;background:var(--card);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;
    box-shadow:0 1px 2px rgba(0,0,0,.03)}
  /* 아주 낮은 화면(구형 아이폰 SE 320×568 등) — 3블록이 안 잘리도록 압축 */
  @media (max-height:620px){
    main{gap:7px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
    .card{padding:11px 14px}
    .qr{width:72px;height:72px}
    .nm{font-size:18px}
    .idt{margin-top:9px;padding-top:9px}
    .rbody{margin-top:7px}
    .stt{font-size:21px}
    .leave{height:42px;margin-top:8px}
  }
  .ct{font-size:16px;font-weight:700;flex:0 0 auto}
  /* 학생증 — 콘텐츠 크기로 축소(안 커지게), 나머지 공간은 이용중·잔여 카드가 차지 */
  .idcard{justify-content:center;flex:0 0 auto;padding-top:13px;padding-bottom:13px}
  .idtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .nm{font-size:20px;font-weight:700}
  .sno{font-size:14px;font-weight:600;color:var(--tint);margin-top:7px;font-variant-numeric:tabular-nums}
  .meta{font-size:12.5px;color:var(--ink3);margin-top:4px;line-height:1.5}
  .qr{width:72px;height:72px;flex:0 0 auto;background:#fff;border:1px solid var(--sep);border-radius:11px;padding:5px}
  .qr img,.qbig img{width:100%;height:100%;image-rendering:pixelated;display:block}
  .idt{margin-top:13px;padding-top:12px;border-top:1px solid var(--sep);text-align:center;font-size:12.5px;color:var(--ink3)}
  /* 이용 중 좌석 */
  .rbody{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:11px}
  .seatmid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px}
  .rm{font-size:13px;color:var(--ink2);font-weight:500}
  .stt{font-size:23px;font-weight:700;margin-top:1px}
  .rowb{display:flex;justify-content:space-between;align-items:baseline}
  .rowb .lb{font-size:14px;color:var(--ink2)} .rowb .vv{font-size:15px;font-weight:700;color:var(--tint)}
  .bar{height:5px;background:var(--track);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--tint);border-radius:99px}
  .tt{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink3)}
  .leave{flex:0 0 auto;width:100%;height:46px;margin-top:12px;border:0;border-radius:12px;background:var(--red-bg);color:var(--red);font-size:16px;font-weight:600}
  .leave:active{background:#ffdedc}
  .noseat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
  .noseat .a{font-size:15px;color:var(--ink2);font-weight:500} .noseat .b{font-size:13px;color:var(--ink3);line-height:1.5}
  /* 잔여 좌석(요약) */
  .hrow{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
  .hrow .more{background:none;border:0;color:var(--tint);font-weight:500;font-size:14px;padding:2px 0}
  .zsum{flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:22px;padding-top:8px}
  .zline .t{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--ink);font-weight:500;margin-bottom:6px}
  .zline .t b{color:var(--tint);font-weight:700} .zline .t .cap{color:var(--ink3);font-size:12px;font-weight:400}
  /* 잔여 좌석(상세) */
  #zlist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
  .zc{background:var(--card);border-radius:14px;padding:15px 17px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .zc .zn{font-size:17px;font-weight:700}
  .zc .zr{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 9px;font-size:14px}
  .zc .zr .u{color:var(--ink3)} .zc .zr .r{color:var(--ink2)} .zc .zr .r b{color:var(--tint);font-weight:700}
  /* 잔여 좌석 약도 */
  #zlist{gap:16px;padding-top:8px}
  .zsum2{text-align:center;font-size:15px;color:var(--ink2)} .zsum2 b{font-size:24px;color:var(--tint);font-weight:800} .zsum2 span{color:var(--ink3);font-size:13px}
  .mleg{display:flex;gap:18px;justify-content:center;font-size:12.5px;color:var(--ink2)}
  .mleg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .mleg .f{background:var(--tint)} .mleg .o{background:#d9820f} .mleg .b{background:#a1a1a8}
  /* 좌석도: 화면 너비에 꽉 차게 유동 크기(A 2열 : 중앙 6열 : C 1열 = 2:6:1) */
  .mmap{display:flex;gap:2.5%;align-items:stretch;background:var(--card);border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .mzone{display:flex;flex-direction:column;justify-content:center;gap:14px}
  .ma{flex:2;display:grid;grid-template-columns:1fr 1fr;gap:14px 6px;align-content:center}
  .mc{flex:1}
  .mmid{flex:6;display:flex;flex-direction:column;justify-content:center}
  .mlec{flex:1;min-height:112px;background:var(--sub);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink3);font-size:15px;font-weight:700}
  .mlec span{font-size:11px;font-weight:500;margin-top:3px}
  .mbrow{display:flex;gap:5px;margin-top:9px}
  .mbrow .mseat{flex:1}
  .mtable{height:9px;background:#e6e6eb;border-radius:5px;margin-top:7px}
  .mseat{aspect-ratio:1;width:100%;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .mseat.free{background:var(--tint-bg);color:var(--tint-d)}
  .mseat.occ{background:#fbefda;color:#b06a10}
  .mseat.blk{background:#ececee;color:#9a9ea4}
  .zhint2{text-align:center;font-size:13px;color:var(--ink3);line-height:1.5;padding:0 8px} .zhint2 b{color:var(--tint-d)}
  /* 내 이용 내역 (열품타 스타일) */
  #histbody{flex:1;min-height:0;overflow:hidden;padding:6px 16px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:11px}
  .hhero{flex:0 0 auto;background:linear-gradient(135deg,#1b7a4b,#2e9e6b);border-radius:22px;padding:20px 22px;color:#fff;text-align:center;box-shadow:0 10px 26px rgba(27,122,75,.30)}
  .hlab{font-size:13.5px;opacity:.88;font-weight:600;letter-spacing:.01em} .hmsg{font-size:13px;opacity:.94;font-weight:500;margin-top:2px}
  .hbig{font-size:40px;font-weight:800;margin:4px 0 6px;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
  .hbig em{font-size:.5em;font-style:normal;font-weight:800;opacity:.9;margin:0 8px 0 3px;letter-spacing:0;vertical-align:baseline}
  .hbig em:last-child{margin-right:0}
  .hstats{flex:0 0 auto;display:flex;gap:9px}
  .hcard{flex:1;min-width:0;background:var(--card);border-radius:16px;padding:15px 6px 13px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .hcard .n{font-size:20px;font-weight:800;color:var(--tint-d);white-space:nowrap;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
  .hcard .n em{font-size:12px;font-style:normal;font-weight:700;margin:0 3px 0 1px;opacity:.8}
  .hcard .n em:last-child{margin-right:0}
  .hcard .l{font-size:12px;color:var(--ink3);margin-top:7px;font-weight:600}
  .hsec{flex:0 0 auto;background:var(--card);border-radius:18px;padding:15px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .hsec.grow{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .hsect{font-size:13.5px;font-weight:800;margin-bottom:12px;flex:0 0 auto;color:var(--ink2)}
  .hlist{flex:1;min-height:0;overflow:hidden}
  .hbars{display:flex;align-items:flex-end;gap:5px;height:90px}
  .hbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%}
  .hbw{flex:1;width:100%;display:flex;align-items:flex-end;background:var(--sub);border-radius:6px;overflow:hidden}
  .hbw i{width:100%;background:#c0e4d1;border-radius:6px;display:block;min-height:0;transition:height .35s ease}
  .hbw i.now{background:var(--tint)}
  .hbar span{font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .hbar span.td{color:var(--tint-d);font-weight:800}
  .hrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--sep)}
  .hrow:last-child{border-bottom:0}
  .hseat{display:flex;align-items:baseline;gap:8px} .hseat b{font-size:16px;font-weight:800} .hgray{color:var(--ink3);font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:500}
  .hdur{display:flex;align-items:center;gap:7px;color:var(--ink2);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .hdur .dot{color:var(--ink3);font-style:normal}
  .hst{font-size:12.5px;font-weight:700}
  .hst.active{color:var(--tint-d)} .hst.ended{color:var(--ink3)} .hst.expired{color:#c0392b} .hst.cancelled{color:var(--ink3)}
  @media (max-height:640px){ .hhero{padding:14px 20px} .hbig{font-size:33px} .hbars{height:68px} .hcard{padding:11px 6px} #histbody{gap:9px} .hsec{padding:12px 16px} }
  /* 공지사항 */
  #nlist{flex:1;min-height:0;overflow-y:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
  .ncard{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .ntitle{font-size:17px;font-weight:800;margin-bottom:7px} .nbody{font-size:15px;color:var(--ink2);line-height:1.55;word-break:keep-all} .ndate{font-size:12.5px;color:var(--ink3);margin-top:10px}
  /* 문의 / 신고 / 비번 */
  .contact{display:flex;justify-content:space-between;align-items:center;background:var(--sub);border-radius:14px;padding:16px 20px;margin-bottom:6px}
  .contact span{font-size:14px;color:var(--ink2);font-weight:600} .contact b{font-size:19px;color:var(--tint-d)}
  .rphint{text-align:center;font-size:14px;color:var(--ink2);line-height:1.55;padding:6px 8px} .rphint b{color:#d9820f}
  .reasons{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  .reasons button{padding:16px;border:1.5px solid var(--sep);background:#fff;border-radius:13px;font-size:16px;font-weight:700;color:var(--ink);font-family:inherit}
  .reasons button:active{background:var(--sub)}
  .reasons button.on{border-color:var(--tint);background:var(--tint-bg);color:var(--tint-d)}
  .confirm.rpt{width:min(340px,88vw)}
  .rptdetail{width:100%;border:1px solid var(--field);border-radius:12px;padding:11px 13px;font-size:15px;font-family:inherit;color:var(--ink);resize:none;margin-bottom:14px;line-height:1.5}
  .rptdetail:focus{outline:none;border-color:var(--tint)}
  .repdetail{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.45;word-break:keep-all}
  .pwin{width:100%;padding:15px 16px;border:1px solid var(--field);border-radius:13px;font-size:16px;margin-bottom:6px}
  .pwin:focus{outline:none;border-color:var(--tint)}
  .pwmsg{font-size:13px;color:var(--red);min-height:18px;margin-bottom:8px;text-align:left}
  /* 관리자(슈퍼계정) */
  .mdot{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg)}
  .mibadge{display:inline-block;min-width:20px;height:20px;line-height:20px;padding:0 6px;margin-left:8px;border-radius:99px;background:var(--red);color:#fff;font-size:12px;font-weight:700;text-align:center;vertical-align:middle}
  .sheet .sh.adm{color:var(--tint-d)}
  .empty{color:var(--ink3);font-size:14px;text-align:center}
  .acompose{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04);display:flex;flex-direction:column;gap:10px}
  .aci{width:100%;padding:13px 14px;border:1px solid var(--field);border-radius:12px;font-size:16px;font-family:inherit;color:var(--ink)}
  .act{width:100%;min-height:96px;padding:13px 14px;border:1px solid var(--field);border-radius:12px;font-size:15px;line-height:1.55;font-family:inherit;color:var(--ink);resize:vertical}
  .aci:focus,.act:focus{outline:none;border-color:var(--tint)}
  .abtn{width:100%;height:46px;border:0;border-radius:12px;background:var(--tint);color:#fff;font-size:16px;font-weight:700;font-family:inherit}
  .abtn:disabled{opacity:.5}
  .nrow{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
  .nrow .ndate{margin-top:0}
  .nAdel{background:var(--red-bg);border:0;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--red);font-family:inherit}
  .rephdr{font-size:13px;color:var(--ink3);font-weight:600;padding:2px 2px 2px}
  .repitem{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .repitem.done{opacity:.55}
  .repmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
  .repseat{flex:0 0 auto;min-width:46px;height:46px;padding:0 8px;border-radius:11px;background:var(--tint-bg);color:var(--tint-d);font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .repinfo{min-width:0}
  .reprsn{font-size:15.5px;font-weight:700;color:var(--ink);word-break:keep-all}
  .repmeta{font-size:12.5px;color:var(--ink3);margin-top:3px}
  .repbtn{flex:0 0 auto;background:var(--tint);border:0;border-radius:11px;padding:11px 16px;font-size:14px;font-weight:700;color:#fff;font-family:inherit}
  .repbtn:disabled{opacity:.5}
  .repdone{flex:0 0 auto;color:var(--tint-d);font-size:22px;font-weight:800}
  /* 비밀번호 초기화 */
  .rpwrap{flex:1;min-height:0;overflow-y:auto;padding:10px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
  .rphint2{font-size:14px;color:var(--ink2);line-height:1.6;text-align:center;padding:4px 6px} .rphint2 b{color:var(--tint-d)}
  .rpsearch{display:flex;gap:8px}
  .rpsearch .aci{flex:1}
  .rpsbtn{width:auto;flex:0 0 auto;padding:0 22px}
  .rpitem{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .rpinfo{min-width:0}
  .rpname{font-size:16px;font-weight:800}
  .rpsub{font-size:13px;color:var(--ink3);margin-top:3px} .rpsub .mono{color:var(--tint-d);font-weight:700}
  .rpbtn{flex:0 0 auto;background:var(--red-bg);border:0;border-radius:11px;padding:11px 16px;font-size:14px;font-weight:700;color:var(--red);font-family:inherit}
  .tempcode{font-size:36px;font-weight:800;letter-spacing:.14em;color:var(--tint-d);background:var(--sub);border-radius:14px;padding:16px;margin:14px 0;font-variant-numeric:tabular-nums;-webkit-user-select:all;user-select:all}
  .rpnote{font-size:13px;color:var(--ink2);line-height:1.6}
  /* 로그인/가입 */
  .auth{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:0 20px}
  .authbox{margin:auto 0;width:100%;max-width:380px;align-self:center;padding:26px 0}
  .applogo{width:66px;height:66px;border-radius:15px;display:block;margin:0 auto 16px;box-shadow:0 5px 16px rgba(0,0,0,.12)}
  .authbox h1{font-size:22px;font-weight:700;text-align:center;margin:0 0 5px}
  .authbox .s{font-size:14px;color:var(--ink2);text-align:center;margin:0}
  .group{background:var(--card);border-radius:12px;overflow:hidden;margin-top:22px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .group .f{display:flex;align-items:center;height:50px;padding:0 16px;border-top:1px solid var(--sep)}
  .group .f:first-child{border-top:0}
  .group input{border:0;background:none;width:100%;height:100%;font-size:17px;color:var(--ink);padding:0;letter-spacing:-.011em}
  .group input:focus{outline:none} .group input::placeholder{color:var(--ink3)}
  .btn{width:100%;height:50px;border:0;border-radius:12px;font-size:17px;font-weight:600;margin-top:18px;background:var(--field);color:#b3b3b8;transition:background .15s,color .15s}
  .btn.on{background:var(--tint);color:#fff} .btn.on:active{background:var(--tint-d)}
  .link{display:block;width:100%;text-align:center;background:none;border:0;color:var(--tint);font-size:15px;font-weight:500;margin-top:17px;padding:8px}
  /* 모달 하단 취소/닫기 — 깔끔한 회색 필 버튼(기본 버튼 방지) */

  // ── 세션/네트워크 (학번 로그인: 합성 이메일) ──
  const KEY_TOK='gn_tok', KEY_AUTO='gn_auto';
  let refreshTimer=null;
  let autoLogin=true; try{ autoLogin = (localStorage.getItem(KEY_AUTO)!=='0'); }catch(_){}   // 자동 로그인(기본 켜짐)
  function readTok(){ try{ return JSON.parse(localStorage.getItem(KEY_TOK) || sessionStorage.getItem(KEY_TOK) || 'null'); }catch(_){ return null; } }
  function writeTok(s){ try{ if(autoLogin){ localStorage.setItem(KEY_TOK,JSON.stringify(s)); sessionStorage.removeItem(KEY_TOK); }
      else { sessionStorage.setItem(KEY_TOK,JSON.stringify(s)); localStorage.removeItem(KEY_TOK); } }catch(_){} }
  function clearTok(){ try{ localStorage.removeItem(KEY_TOK); sessionStorage.removeItem(KEY_TOK); }catch(_){} }
  let session = DEMO ? null : readTok();
  if(session && (session.access_token==='demo' || !session.access_token)){ session=null; clearTok(); }  // 데모/잔상 세션 정리
  const synthEmail = sno => `${String(sno).trim()}@greennarae.com`;   // 합성 이메일(실제 발송 안 함, 이메일확인 OFF 필수). .local/.app 은 Supabase가 거부해서 .com 사용
  const baseH=()=>({apikey:SUPABASE_KEY,"Content-Type":"application/json"});
  const authH=()=>({...baseH(),Authorization:"Bearer "+((session&&session.access_token)||SUPABASE_KEY)});
  async function auth(path,body){ const r=await fetch(`${SUPABASE_URL}/auth/v1/${path}`,{method:"POST",headers:baseH(),body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({})); if(!r.ok) throw (j.error_description||j.msg||j.message||'요청 실패'); return j; }
  async function rpc(fn,args){ const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:"POST",headers:authH(),body:JSON.stringify(args||{})});
    if(!r.ok) throw new Error(await r.text()); return r.json(); }
  async function rest(path,opt){ const r=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{headers:authH(),...(opt||{})});
    if(r.status===401){ logout(); throw new Error('401'); } if(!r.ok) throw new Error(await r.text());
    return r.status===204?null:r.json(); }
  function saveSession(s){ session=s; writeTok(s); scheduleRefresh(); }
  function logout(){ session=null; clearTok(); clearTimers(); clearTimeout(refreshTimer); if(adminTimer){clearInterval(adminTimer);adminTimer=null;} IS_ADMIN=false; unresolvedN=0; seenReportAt=0; hideOv(); mode='login'; screenAuth(); }
  // 토큰 자동 갱신(자동 로그인이 1시간 뒤 안 풀리게) — refresh_token 으로 만료 1분 전 재발급
  async function refreshSession(){

    try{ const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:baseH(),body:JSON.stringify({refresh_token:session.refresh_token})});
      if(!r.ok) return false; const s=await r.json();
      if(s&&s.access_token){ saveSession(s); return true; } return false;
    }catch(_){ return false; }
  }
  function scheduleRefresh(){ clearTimeout(refreshTimer); if(!session||!session.expires_at) return;
    const ms=session.expires_at*1000 - Date.now() - 60000;   // 만료 1분 전
    refreshTimer=setTimeout(refreshSession, Math.max(5000, ms)); }

  // ── 타이머/오버레이/토스트 ──
  let timers=[]; function clearTimers(){ timers.forEach(clearInterval); timers=[]; }
  function showOv(html){ ov.innerHTML='<div class="ovbg"></div>'+html; ov.hidden=false; ov.querySelector('.ovbg').onclick=hideOv; }

    let p=null;

    if(!Array.isArray(p)) p=await rest(`profiles?select=name,student_no&id=eq.${session.user.id}`);                 // 컬럼 없으면(관리자 SQL 전) 폴백
    return Array.isArray(p)?p[0]:null; }

  async function fetchZones(){ if(DEMO) return [{zone:'A',total:8,used:3,blocked:0,remain:5},{zone:'B',total:12,used:7,blocked:1,remain:4},{zone:'C',total:4,used:1,blocked:0,remain:3}];
    const rows=await rest(`seat_status?select=zone,occupied,is_blocked`); return aggZones(rows); }
  function aggZones(rows){ const Z={A:{t:0,u:0,b:0},B:{t:0,u:0,b:0},C:{t:0,u:0,b:0}};
    (rows||[]).forEach(r=>{ const z=Z[r.zone]; if(!z) return; z.t++; if(r.is_blocked) z.b++; else if(r.occupied) z.u++; });

    const r=await rpc('mint_qr',{}); return Array.isArray(r)?r[0]:r; }
  function okOf(r){ return !!(r && (r.ok===true || (Array.isArray(r)&&r[0]&&r[0].ok))); }

      <button class="x" id="qx">닫기</button></div>`); drawQR($("#qrbig"),6); $("#qx").onclick=hideOv; }

  // ── 포맷 ──
  const p2=n=>String(n).padStart(2,'0');
  function fmtNow(){ const d=new Date(), ap=d.getHours()<12?'오전':'오후'; let h=d.getHours()%12||12;
    return `${d.getFullYear()}. ${p2(d.getMonth()+1)}. ${p2(d.getDate())}.  ${ap} ${p2(h)}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`; }

  const MAP_A=['A1','A2','A3','A4','A5','A6','A7','A8'], MAP_BT=['B1','B2','B3','B4','B5','B6'],

  function esc(s){ return String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])).replace(/\n/g,'<br>'); }
  function fmtDur(ms){ const m=Math.round(ms/60000), h=Math.floor(m/60); return h>0?`${h}시간 ${m%60}분`:`${m}분`; }
  // 숫자는 크게, 단위(시간·분)는 작은 em 으로 — 애플식. 절대 줄바꿈 안 되도록 카드/히어로에서 nowrap.
  function fmtDurEm(ms){ const m=Math.round(ms/60000), h=Math.floor(m/60), mm=m%60;
    if(h>0&&mm>0) return `${h}<em>시간</em>${mm}<em>분</em>`;
    if(h>0) return `${h}<em>시간</em>`;
    return `${mm}<em>분</em>`; }
  function fmtHourEm(ms){ const m=Math.round(ms/60000), h=Math.floor(m/60); return h>=1?`${h}<em>시간</em>`:`${m}<em>분</em>`; }  // 누적: 시간 단위로 압축(카드 안 넘침)

  // ── 내 이용 내역 (열품타 스타일: 이번 달 공부시간·연속출석·일별 그래프) ──
  function screenHistory(){
    clearTimers();
    screen.innerHTML=`<div class="hd"><button class="back" id="bk">‹ 뒤로</button><h1>내 이용 내역</h1></div>
      <div id="histbody"><div class="empty" style="margin:24px 16px">불러오는 중…</div></div>`;
    $("#bk").onclick=screenHome;
    (async()=>{
      let rows=[]; try{ rows=await rest(`reservations?select=seat_id,start_at,end_at,status&user_id=eq.${session.user.id}&order=start_at.desc&limit=500`)||[]; }catch(e){}
      const now=Date.now();
      const dur=r=>{ const s=new Date(r.start_at).getTime(); let e=new Date(r.end_at).getTime(); if(r.status==='active') e=Math.min(e,now); return Math.max(0,e-s); };
      const dk=t=>{ const d=new Date(t); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
      const nowD=new Date(), mKey=nowD.getFullYear()+'-'+(nowD.getMonth()+1), tKey=dk(now);
      const byDay={}; let monthMs=0,todayMs=0,totalMs=0;
      rows.forEach(r=>{ const ms=dur(r); totalMs+=ms; const k=dk(r.start_at); byDay[k]=(byDay[k]||0)+ms;
        const sd=new Date(r.start_at); if(sd.getFullYear()+'-'+(sd.getMonth()+1)===mKey) monthMs+=ms; if(k===tKey) todayMs+=ms; });
      let streak=0, i=byDay[tKey]?0:1;
      for(;i<400;i++){ const d=new Date(now-i*86400000); if(byDay[d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()]) streak++; else break; }
      const days=[]; for(let j=13;j>=0;j--){ const d=new Date(now-j*86400000); const k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); days.push({lab:d.getDate(),ms:byDay[k]||0,today:k===tKey}); }
      const maxMs=Math.max(60000,...days.map(d=>d.ms));
      const msg = monthMs<=0 ? '첫 예약으로 기록을 시작해보세요 🌿'
        : streak>=3 ? `🔥 ${streak}일 연속 출석 중! 이 기세로 가봅시다`
        : monthMs>=20*3600000 ? `이번 달 벌써 ${Math.round(monthMs/3600000)}시간! 멋져요`
        : '꾸준함이 실력이 됩니다 🌿';
      const bars=days.map(d=>`<div class="hbar"><div class="hbw"><i class="${d.today?'now':''}" style="height:${d.ms>0?Math.max(10,Math.round(d.ms/maxMs*100)):0}%"></i></div><span${d.today?' class="td"':''}>${d.lab}</span></div>`).join('');
      const recent = rows.slice(0,6).map(r=>{ const sd=new Date(r.start_at), md=(sd.getMonth()+1)+'/'+sd.getDate();
        const st=r.status==='active'?'이용중':r.status==='ended'?'퇴실':r.status==='expired'?'만료':'취소';
        return `<div class="hrow"><div class="hseat"><b>${r.seat_id}</b><span class="hgray">${md}</span></div><div class="hdur">${fmtDur(dur(r))}<i class="dot">·</i><span class="hst ${r.status}">${st}</span></div></div>`; }).join('') || '<p class="empty" style="padding:18px">아직 이용 기록이 없어요</p>';
      const b=$("#histbody"); if(!b) return;
      b.innerHTML=`
        <div class="hhero"><div class="hlab">이번 달 공부 시간</div><div class="hbig">${fmtDurEm(monthMs)}</div><div class="hmsg">${msg}</div></div>
        <div class="hstats">
          <div class="hcard"><div class="n">${fmtDurEm(todayMs)}</div><div class="l">오늘</div></div>
          <div class="hcard"><div class="n">${streak}<em>일</em></div><div class="l">연속 출석</div></div>
          <div class="hcard"><div class="n">${fmtHourEm(totalMs)}</div><div class="l">누적</div></div>
        </div>
        <div class="hsec"><div class="hsect">최근 2주</div><div class="hbars">${bars}</div></div>
        <div class="hsec grow"><div class="hsect">최근 이용</div><div class="hlist">${recent}</div></div>`;
    })();
  }

  async function pollReports(silent){
    if(!IS_ADMIN||DEMO) return [];
    let r; try{ r=await rpc('me_reports',{}); }catch(e){ return []; }
    const rows=(r&&r.rows)||(Array.isArray(r)&&r[0]&&r[0].rows)||[];
    const unresolved=rows.filter(x=>!x.resolved_at);
    unresolvedN=unresolved.length; updateMenuBadge();
    const latest=rows.reduce((m,x)=>Math.max(m,+new Date(x.at)),0);
    if(!silent){ const fresh=unresolved.filter(x=>+new Date(x.at)>seenReportAt); if(fresh.length) notifyReports(fresh); }
    seenReportAt=Math.max(seenReportAt,latest);
    if($("#repadmin")) renderReportsAdmin(rows);
    return rows;
  }

    rows=(rows||[]).slice().sort((a,b)=> (a.resolved_at?1:0)-(b.resolved_at?1:0) || (+new Date(b.at)-+new Date(a.at)) );
    const un=rows.filter(r=>!r.resolved_at).length;
    el.innerHTML = `<div class="rephdr">미처리 <b>${un}</b>건 · 전체 ${rows.length}건</div>` + (rows.length ? rows.map(r=>`
      <div class="repitem ${r.resolved_at?'done':''}">
        <div class="repmain"><div class="repseat">${r.seat_id||'—'}</div>
          <div class="repinfo"><div class="reprsn">${esc(r.reason||'기타')}</div>
            ${r.detail?`<div class="repdetail">${esc(r.detail)}</div>`:''}
            <div class="repmeta">${new Date(r.at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}${r.resolved_at?' · 처리완료':''}</div></div></div>
        ${r.resolved_at?'<span class="repdone">✓</span>':`<button class="repbtn" data-id="${r.id}">처리완료</button>`}
      </div>`).join('') : '<p class="empty" style="padding:18px">접수된 민원이 없어요</p>');
    el.querySelectorAll('.repbtn').forEach(btn=>btn.onclick=async()=>{ btn.disabled=true;
      try{ const r=await rpc('me_resolve',{p_id:btn.dataset.id}); if(okOf(r)){ toast('처리했어요'); const rows2=await pollReports(true); renderReportsAdmin(rows2); } else { btn.disabled=false; toast('처리 실패'); } }
      catch(e){ btn.disabled=false; toast('처리 실패'); } });
  }

  // ── 비밀번호 초기화(관리자): 학번 검색 → 임시 비번 (계정/열품타 유지) ──
  function screenResetPw(){
    clearTimers();
    screen.innerHTML=`<div class="hd"><button class="back" id="bk">‹ 뒤로</button><h1>비밀번호 초기화</h1></div>
      <div id="rplist" class="rpwrap">
        <p class="rphint2">학번을 검색해 임시 비밀번호로 초기화하세요.</p>
        <div class="rpsearch"><input class="aci" id="rpq" placeholder="학번 또는 이름 검색" inputmode="search"><button class="abtn rpsbtn" id="rpgo">검색</button></div>
        <div id="rpresults"></div>
      </div>`;
    $("#bk").onclick=screenHome;
    const doSearch=async()=>{
      const q=$("#rpq").value.trim(); const el=$("#rpresults"); if(!el) return;
      if(!q){ el.innerHTML=''; return; }
      el.innerHTML='<p class="empty" style="padding:14px">검색 중…</p>';
      let r; try{ r=await rpc('me_find_member',{p_q:q}); }catch(e){ el.innerHTML='<p class="empty" style="padding:14px">검색 실패</p>'; return; }
      const rows=(r&&r.rows)||[];
      el.innerHTML = rows.length ? rows.map(m=>`<div class="rpitem">
          <div class="rpinfo"><div class="rpname">${esc(m.name||'—')}</div><div class="rpsub"><span class="mono">${esc(m.student_no)}</span> · 이용 ${m.uses||0}회</div></div>
          <button class="rpbtn" data-sno="${esc(m.student_no)}" data-name="${esc(m.name||'')}">초기화</button></div>`).join('')
        : '<p class="empty" style="padding:16px">검색 결과가 없어요</p>';
      el.querySelectorAll('.rpbtn').forEach(b=>b.onclick=()=>askReset(b.dataset.sno, b.dataset.name));
    };
    $("#rpgo").onclick=doSearch;
    $("#rpq").addEventListener('keydown',e=>{ if(e.key==='Enter') doSearch(); });
    setTimeout(()=>{ const i=$("#rpq"); if(i) i.focus(); }, 120);
  }
  function genTempPw(){ return '000000'; }   // 임시 비밀번호: 0 6자리(회원에게 전달 후 로그인→변경)
  function askReset(sno, name){
    confirmSheet('비밀번호 초기화', `${esc(name||sno)}님(${esc(sno)})의 비밀번호를 임시로 초기화할까요?<br><b>이용 기록(열품타)은 그대로 유지</b>됩니다.`, '초기화', false, async()=>{
      hideOv(); const temp=genTempPw();
      try{ const r=await rpc('me_reset_pw',{p_student_no:sno, p_newpw:temp});
        if(okOf(r)) showTempPw(sno, name, temp); else toast(errOf(r)||'초기화 실패');
      }catch(e){ toast('초기화 실패'); }
    });
  }
  function showTempPw(sno, name, temp){
    showOv(`<div class="confirm"><h3>초기화 완료</h3>
      <p style="line-height:1.6">${esc(name||sno)}님(<span class="mono">${esc(sno)}</span>)의 임시 비밀번호</p>
      <div class="tempcode">${temp}</div>
      <p class="rpnote">이 임시 비밀번호를 회원에게 알려주세요.<br>회원은 로그인 후 <b>메뉴 → 비밀번호 변경</b>에서 바꾸면 됩니다.</p>
      <div class="cb"><button class="ok" id="tok">확인</button></div></div>`);
    $("#tok").onclick=hideOv;
  }

  // ── 퇴실 30분 전 알림(웹푸시): 최초 로그인 팝업 + 메뉴 ON/OFF 토글 ──
  let pushOn=false, pushInit=false;
  function pushSupported(){ return !!VAPID_PUBLIC && ('serviceWorker'in navigator) && ('PushManager'in window) && typeof Notification!=='undefined'; }
  async function currentSub(){ try{ const reg=await navigator.serviceWorker.ready; return await reg.pushManager.getSubscription(); }catch(_){ return null; } }
  async function enablePush(){   // 권한 요청(필요시) + 구독 + 저장
    if(!pushSupported() || !session) return false;
    let perm=Notification.permission;
    if(perm==='default') perm=await Notification.requestPermission();
    if(perm==='denied'){ toast('브라우저 설정에서 알림을 허용해 주세요'); return false; }
    if(perm!=='granted') return false;
    try{
      const reg=await navigator.serviceWorker.ready;
      let sub=await reg.pushManager.getSubscription();
      if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlB64(VAPID_PUBLIC)});
      const r=await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions`,{method:'POST',
        headers:{...authH(),Prefer:'resolution=merge-duplicates'},
        body:JSON.stringify({user_id:session.user.id, endpoint:sub.endpoint, sub})});
      pushOn = r.ok; return pushOn;
    }catch(_){ return false; }
  }
  async function disablePush(){   // 구독 해제 + 저장 삭제
    try{ const sub=await currentSub();
      if(sub){ try{ await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions?endpoint=eq.${encodeURIComponent(sub.endpoint)}`,{method:'DELETE',headers:authH()}); }catch(_){}
        await sub.unsubscribe().catch(()=>{}); }
    }catch(_){}
    pushOn=false; return true;
  }
  async function initPush(){   // 앱 켤 때마다: 허용돼 있으면 조용히 구독, 미설정이면 안내 팝업(최대한 켜도록)
    if(pushInit || DEMO || !pushSupported()) return; pushInit=true;
    if(Notification.permission==='granted'){ enablePush(); return; }   // 이미 허용 → 조용히 구독 유지
    if(Notification.permission!=='default') return;   // 거부(차단) 상태면 재요청 불가 → 팝업 생략
    // 미설정('default') → 앱 켤 때마다 안내(1회/세션)
    showOv(`<div class="confirm pushask"><div class="pushemoji">🔔</div><h3>퇴실 알림 받기</h3>
      <p>이용시간 <b>30분 전</b>에 알려드려요.<br>알림 권한을 켜주세요.</p>
      <div class="cb"><button class="cc" id="pushlater">나중에</button><button class="ok" id="pushnow">알림 켜기</button></div></div>`);
    $("#pushlater").onclick=hideOv;
    $("#pushnow").onclick=async()=>{ hideOv(); const ok=await enablePush(); if(ok) toast('퇴실 알림을 켰어요 🔔'); };
  }
  async function updatePushToggle(){   // 메뉴 토글 상태 반영
    const t=$("#pushtgl"); if(!t) return;
    let on=false;
    if(pushSupported() && Notification.permission==='granted') on = !!(await currentSub());
    pushOn=on; t.classList.toggle('on', on);
  }
  function urlB64(s){ const p='='.repeat((4-s.length%4)%4); const b=(s+p).replace(/-/g,'+').replace(/_/g,'/'); const raw=atob(b); return Uint8Array.from([...raw].map(c=>c.charCodeAt(0))); }

  // ── 로그인 / 가입 (학번 + 비밀번호) ──
  let mode='login';
  function msg(t,ok){ const m=$("#msg"); if(!m)return; m.className='msg '+(ok?'ok':'err'); m.textContent=t; }
  function screenAuth(){
    clearTimers();
    const signup = mode==='signup';
    screen.innerHTML=`<div class="auth"><div class="authbox">
      <img class="applogo" src="icon.svg" alt="그린나래">
      <h1>그린나래</h1>
      <p class="s">${signup?'학번·이름·비밀번호로 가입하세요':'학번과 비밀번호로 로그인하세요'}</p>
      <div class="group">
        <div class="f"><input id="sno" inputmode="numeric" autocomplete="username" placeholder="학번"></div>
        ${signup?`<div class="f"><input id="nm" placeholder="이름"></div>`:''}
        <div class="f"><input id="pw" type="password" autocomplete="${signup?'new-password':'current-password'}" placeholder="비밀번호"></div>
      </div>
      ${!signup?`<label class="chk"><input type="checkbox" id="autock" ${autoLogin?'checked':''}><span class="box"></span>자동 로그인</label>`:''}
      <button class="btn" id="go">${signup?'가입하고 시작':'로그인'}</button>
      <button class="link" id="swap">${signup?'이미 계정이 있어요 · 로그인':'계정이 없나요? 회원가입'}</button>
      ${signup?`<p class="note">가입 시 학번·이름 수집·이용에 동의하게 됩니다.<br>좌석 예약·알림 목적이며 탈퇴 시 파기됩니다.</p>`:''}
      <div id="msg"></div></div></div>`;
    const upd=()=>{ const ok=$("#sno").value.trim() && $("#pw").value.trim().length>0 && (!signup || $("#nm").value.trim()); $("#go").classList.toggle('on',!!ok); };
    screen.querySelectorAll('.group input').forEach(i=>i.oninput=upd); upd();
    $("#swap").onclick=()=>{ mode=signup?'login':'signup'; screenAuth(); };
    $("#go").onclick=submitAuth;
  }
  async function submitAuth(){
    const sno=$("#sno").value.trim(), pw=$("#pw").value;
    if(!sno){ msg('학번을 입력하세요'); return; }
    if(pw.length<6){ msg('비밀번호는 6자 이상이어야 해요'); return; }
    if(mode==='signup' && !$("#nm").value.trim()){ msg('이름을 입력하세요'); return; }
    if(DEMO){ demoProfile={student_no:sno,name:(mode==='signup'?$("#nm").value.trim():demoProfile.name)};
      saveSession({access_token:'demo',user:{id:'demo'}}); enter(); return; }
    $("#go").disabled=true;
    try{
      if(mode==='signup'){ const nm=$("#nm").value.trim();
        const s=await auth('signup',{email:synthEmail(sno),password:pw});
        if(s.access_token){ saveSession(s); await upsertProfile(sno,nm); enter(); }
        else { mode='login'; screenAuth(); msg('가입 완료! 로그인해 주세요.',true); }
      } else {
        autoLogin = $("#autock") ? $("#autock").checked : autoLogin;   // 자동 로그인 선택 반영
        try{ localStorage.setItem(KEY_AUTO, autoLogin?'1':'0'); }catch(_){}
        const s=await auth('token?grant_type=password',{email:synthEmail(sno),password:pw}); saveSession(s); enter();
      }
    }catch(e){ msg(loginErr(String(e))); } finally{ const g=$("#go"); if(g) g.disabled=false; }
  }
  function loginErr(e){ if(/Invalid login/i.test(e)) return '학번 또는 비밀번호가 올바르지 않아요'; if(/already registered/i.test(e)) return '이미 가입된 학번이에요. 로그인해 주세요'; return e; }
  async function upsertProfile(sno,nm){
    if(!session||!session.user){ throw new Error('세션이 만료됐어요. 다시 로그인해 주세요.'); }
    const r=await fetch(`${SUPABASE_URL}/rest/v1/profiles`,{method:'POST',headers:{...authH(),"Prefer":"resolution=merge-duplicates"},
      body:JSON.stringify({id:session.user.id,student_no:sno,name:nm,consent_at:new Date().toISOString()})});
    if(!r.ok) throw new Error(await r.text());
  }
  function screenProfile(){
    clearTimers();
    screen.innerHTML=`<div class="auth"><div class="authbox"><h1>프로필 설정</h1><p class="s">처음 한 번만 입력하면 됩니다</p>
      <div class="group"><div class="f"><input id="sno" inputmode="numeric" placeholder="학번"></div>
        <div class="f"><input id="nm" placeholder="이름"></div></div>
      <button class="btn on" id="save">저장</button><div id="msg"></div></div></div>`;
    const s2=$("#sno"), n2=$("#nm");
    $("#save").onclick=async()=>{ const sno=s2.value.trim(),nm=n2.value.trim();
      if(!sno||!nm){ msg('학번과 이름을 입력하세요'); return; }
      try{ await upsertProfile(sno,nm); enter(); }catch(e){ msg('저장 실패'); } };
  }

  function enter(){ hideOv(); screenHome(); }

  // 서비스워커 등록(PWA 설치/오프라인) — 모든 사용자
  if('serviceWorker'in navigator && !DEMO){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(_){} }

  // ── PWA 앱 설치 ──
  let deferredPrompt=null;
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  function isStandalone(){ try{ return matchMedia('(display-mode: standalone)').matches || navigator.standalone===true; }catch(_){ return false; } }
  function installAvailable(){ return !isStandalone() && (!!deferredPrompt || isIOS); }
  function showInstallBtn(){ const b=$("#installBtn"); if(b) b.hidden = !installAvailable(); }
  window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt=e; showInstallBtn(); });
  window.addEventListener('appinstalled', ()=>{ deferredPrompt=null; showInstallBtn(); try{toast('앱이 설치됐어요 🌿');}catch(_){} });
  async function doInstall(){
    if(deferredPrompt){ deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(_){} deferredPrompt=null; showInstallBtn(); return; }
    if(isIOS){ showOv(`<div class="confirm"><h3>홈 화면에 추가</h3><p style="text-align:left;line-height:1.75">아이폰은 <b>Safari</b>에서 설치해요.<br>① 하단 <b>공유</b> 아이콘 누르기<br>② <b>홈 화면에 추가</b> 선택</p><div class="cb"><button class="ok" id="iok">확인</button></div></div>`); $("#iok").onclick=hideOv; return; }
    showOv(`<div class="confirm"><h3>앱 설치</h3><p style="text-align:left;line-height:1.75">브라우저 메뉴(<b>⋮</b>)에서<br><b>"앱 설치"</b> 또는 <b>"홈 화면에 추가"</b>를 눌러주세요.<br><br>안 보이면 페이지를 새로고침한 뒤 다시 시도하세요.</p><div class="cb"><button class="ok" id="iok">확인</button></div></div>`); $("#iok").onclick=hideOv;
  }

  // ── 휴대폰 하드웨어 뒤로가기 대응: 모달/서브화면에서 앱이 꺼지지 않고 이전 화면으로 ──
  try{ history.pushState({gn:1}, ''); }catch(_){}   // 센티넬 버퍼(뒤로 눌러도 종료 안 되게)
  let __gnBack=0;
  window.addEventListener('popstate', function(){
    if(ov && !ov.hidden){ hideOv(); try{history.pushState({gn:1},'');}catch(_){} return; }                    // 모달/메뉴 열림 → 닫기
    if(document.querySelector('#screen .hd .back')){ screenHome(); try{history.pushState({gn:1},'');}catch(_){} return; }  // 서브화면 → 홈으로
    var t=Date.now();                                                                                          // 홈/로그인 → 한 번 더 누르면 종료
    if(t-__gnBack<2000){ try{history.back();}catch(_){} return; }
    __gnBack=t; try{history.pushState({gn:1},'');}catch(_){}
    try{ toast('뒤로 한 번 더 누르면 닫혀요'); }catch(_){}
  });

  // ── 시작 ── (자동 로그인: 세션 있으면 만료 확인 → 필요시 토큰 갱신 후 홈)
  (async function boot(){
    if(!DEMO && session && session.access_token){
      const exp = session.expires_at ? session.expires_at*1000 : 0;
      if(exp && exp < Date.now()+30000){          // 만료(임박) → refresh 시도
        const ok = await refreshSession();
        if(!ok){ clearTok(); session=null; screenAuth(); return; }
      }
      scheduleRefresh(); screenHome(); return;
    }
    screenAuth();
  })();
})();
</script>
